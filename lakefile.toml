name = "sp1-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SP1Operations", "SP1Chips"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
# autoImplicit = false 

[[require]]
name = "mathlib"
scope = "leanprover-community"

# [[require]]
# name = "Lean_RV32D"
# git = "https://github.com/succinctlabs/sail-rv32d-lean"
# rev = "nightly"

[[lean_lib]]
name = "SP1Foundations"

[[lean_lib]]
name = "SP1Operations"

[[lean_lib]]
name = "SP1Chips"

[[lean_lib]]
name = "LeanRV32D"

[[lean_exe]]
name = "run-rv32d"
root = "LeanRV32D"