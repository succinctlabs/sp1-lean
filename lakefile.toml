name = "sp1-clean-native"
# All three hand-written libraries build by default: the upstream-destined `ToClean`/`ToMathlib`
# roots are listed explicitly so every module in those trees is compiled (and linted) even
# before an `SP1Clean` module happens to import it.
defaultTargets = ["SP1Clean", "ToClean", "ToMathlib"]

moreLeanArgs = ["--tstack=400000"]

# `lake lint` driver — the project-local environment-linter pass (`scripts/sp1Lint.lean`). It runs a
# curated subset of the Batteries `#lint` linters over the hand-written `SP1Clean.*` declarations only,
# excluding the auto-generated `Extracted/`+`*Vectors` code. We use a thin custom driver (not the stock
# `runLinter` exe) because `runLinter` scopes by namespace *root*, which cannot exclude `SP1Clean.Extracted`
# while keeping `SP1Clean.Proofs`. Needs a built project first (env linters read oleans); run after `lake build`.
lintDriver = "sp1Lint"

# `lake test` driver — builds/elaborates the top-level `SP1CleanTest` library (the witness- and
# whole-trace conformance anchors). Those anchors are the project's ONLY `native_decide` (which trusts
# the whole Lean compiler via `Lean.ofReduceBool`/`Lean.trustCompiler`), so they are quarantined in
# this test library, OUT of the main `SP1Clean` library — kept `native_decide`-free by the
# `scripts/check_no_native_decide.sh` source gate (the CI `guards` job + the audit). Run with `lake test`.
testDriver = "SP1CleanTest"

# Built-in options only — the Mathlib style linters are applied per-lib via `moreLeanArgs`
# (see the pillar libraries below), NOT here at package scope: that keeps the auto-gen
# `SP1Extracted` library cleanly out of the linter set. (Every hand-written pillar transitively
# imports Mathlib, so the `-D linter.*` options register fine when applied per-lib.)
[leanOptions]
pp.unicode.fun = true
synthInstance.maxHeartbeats = 1000000

# Every dependency is an immutable published pin, so a clean clone builds this project. Toolchain is
# Lean v4.32.2 (see `lean-toolchain`); each pin below is at or compatible with it.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.2"

# Clean, pinned to a FORK — the one dependency here that is not upstream. Base is upstream
# `0e53b9f2` (v4.32.2 `main`, post PR #443 "bump-lean-4.32.2"); the fork's `sp1-integration` branch
# carries changes that MODIFY existing Clean declarations and therefore cannot live in our additive
# `ToClean` library, because downstream Clean theorems refer to Clean's declaration, not ours.
# Delta at this pin — two changes, one branch per upstream PR:
#   `agreesbelow-data-hint`:
#     f5ae8e17  `ProverEnvironment.AgreesBelow` constrains `data`/`hint`, not just `get`
#     8301b77a  `Clean/Examples/DataWitness.lean`, the worked example + falseness witness
#   `witgen-share`:
#     410ffba8  `WitgenIR.share` subterm sharing into let-steps + `Operations.witgenJsonShared?`
#               (without it, tree-expanding serialization makes SP1's DivRem witgen payload 1.22 GB)
#     4a9c2c7b  the eval-preservation proof `WitgenIR.eval_share` (axiom-clean), making the pass a
#               proven transformation the serializer applies unconditionally
# Rationale, the PR queue, and the exit condition are in `docs/agents/clean-upstream.md`; the trust
# consequence is disclosed in `docs/release-audit.md`. **Re-pin to upstream as the PRs merge.**
# NB `sp1-integration` must keep this rev reachable (see the PolyFun note below) — never force-push it.
[[require]]
name = "Clean"
git = "https://github.com/dtumad/clean"
rev = "2dad7788d58b09eabeb3898506e4cb896e5d3e9d"

# Sail RV64 model. Package name is `Lean_RV64D` (opencompl upstream naming); it exposes the
# `LeanRV64D` library the project imports. Requiring by the real package name dedups with
# riscv-lean's transitive `Lean_RV64D` requirement onto this one copy.
# The pinned snapshot is GENERATED, not hand-edited: pinned rems-project/sail + riscv/sail-riscv
# sources with the SP1 platform config `scripts/sail-config/sp1_rv64d_cfg.json` (regenerate and
# verify with `scripts/sail-config/generate_lean_rv64d.sh`; provenance in the snapshot's commit
# message and docs/agents/sail-model-provenance.md). It equals the opencompl base `11d8fa21` (the
# snapshot riscv-lean PR #59 pins, generated against lean-sail v5) except the six platform-value
# sites the config sets. Stock upstream is not usable: its CLINT and signature windows lie inside
# the address range SP1's chips bound accesses to, which makes the memory-bridge lemmas false as
# stated, not merely unproved.
# NB the generated model and the Sail runtime must move together: a v4-generated snapshot against
# Sail v5 fails with `unknown namespace Sail.ConcurrencyInterfaceV2`.
[[require]]
name = "Lean_RV64D"
git = "https://github.com/succinctlabs/sail-riscv-lean"
rev = "df1acf579f8daf97c4dc3248565dec5a123079ef"

# Lightweight ISA fns. Pinned to the succinctlabs fork head, which is the head of the open
# opencompl/riscv-lean PR #59 ("chore: update to v4.32.2"); repoint to opencompl once that merges.
[[require]]
name = "RISCV"
git = "https://github.com/succinctlabs/riscv-lean"
rev = "d1d678c67f3039b5fb8a9c5aba76904c5793756b"

# lean-sail runtime, upstream release tag `v5` — the revision riscv-lean PR #59 pins.
[[require]]
name = "Sail"
git = "https://github.com/rems-project/lean-sail"
rev = "079463134b9c50450b8393e1566a09fc492a34d9"

# PolyFun supplies only the semantic `DynSystem.Machine`/`Run` packaging. Lenses and the broader
# extensible-machine theory are not used; circuit construction and bus proofs remain independent.
# Pinned to `main` (upstream carries the v4.32.2 bump since PR #106) — not a side branch and not a
# fork. NB: a rev must be reachable from a branch or tag — lake clones `refs/heads/*` + tags and then
# checks out, so a commit that lives only on `refs/pull/*` fails with `fatal: unable to read tree` on
# every machine that lacks a warm cache. That is exactly how the previous pin (PR #34's head) broke.
[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "d062ba2cbb3a50ba5b9f3ba349ca003e6c79630a"

# The `lake lint` driver executable (see `lintDriver` above). A thin wrapper around the Batteries
# `#lint` framework; `supportInterpreter` is required because the linters' `test` functions are run
# through the interpreter. Built by `lake build` along with the libraries; invoked by `lake lint`.
[[lean_exe]]
name = "sp1Lint"
srcDir = "scripts"
supportInterpreter = true

# Upstream-destined libraries, at the BOTTOM of the import DAG: `ToMathlib` imports only Mathlib;
# `ToClean` imports Clean (and may import `ToMathlib`); NEITHER may import `SP1Clean`. That rule is
# what keeps them genuinely contributable — and what makes the terminal step of an accepted upstream
# PR a plain deletion plus a repoint of the importers to `Mathlib.*`/`Clean.*`. Both carry the same
# eight-flag linter set as the core pillars: material heading upstream gets no relaxation.
# Root indices `ToMathlib.lean`/`ToClean.lean` are hand-maintained (this project has no `mk_all`),
# and `scripts/check_root_index.sh` gates all three trees.
[[lean_lib]]
name = "ToMathlib"
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]

[[lean_lib]]
name = "ToClean"
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]

# Umbrella library — root module `SP1Clean.lean` imports every module; `lake build` (the default
# target) builds everything through it. Package-level `moreLeanArgs`/`[leanOptions]` above apply to
# all libraries, so the layer libraries below inherit `--tstack`/heartbeats with no duplication.
[[lean_lib]]
name = "SP1Clean"

# Layer build-targets (select modules by submodule glob; module names stay `SP1Clean.*`, so these add
# no import churn). They make each pillar independently buildable — `lake build SP1Extracted`, etc.
# NOTE: isolation is by convention, not enforced — Lake does not forbid cross-layer imports within one
# package.
#
# Lib-scoped Mathlib style linters. Every hand-written core pillar (Math/Model/FormalModel/Native +
# Proofs/Faithful/Soundness) plus the `SP1CleanTest` test lib carries the SAME `moreLeanArgs` linter set
# below; they all transitively import Mathlib (Native via Clean), so the `-D linter.*` options are
# registered and these flags apply during `lake build SP1Clean` / `lake test`. All eight are at zero
# violations. `linter.style.longLine` is the remaining candidate (real fallout, concentrated in
# Native/FormalModel) — see `docs/roadmap.md` § "Cleanup / polish backlog". The auto-gen `SP1Extracted` library is
# deliberately left OUT (it carries per-file `set_option linter.all false` instead), as are the
# auto-gen `*Vectors` modules inside `SP1CleanTest` (same per-file suppression). The two
# upstream-destined libraries above carry the same set. KEEP THE EIGHT COPIES IN SYNC.
[[lean_lib]]
name = "SP1Math"
globs = ["SP1Clean.Math.+"]
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]

[[lean_lib]]
name = "SP1Model"
globs = ["SP1Clean.Model.+"]
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]

# Auto-gen pillar — NO linter args (the generated modules carry `set_option linter.all false`).
[[lean_lib]]
name = "SP1Extracted"
globs = ["SP1Clean.Extracted.+"]

[[lean_lib]]
name = "SP1FormalModel"
globs = ["SP1Clean.FormalModel.+"]
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]

[[lean_lib]]
name = "SP1Native"
globs = ["SP1Clean.Native.+"]
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]

# The proof pillar: the sound/complete proofs (Proofs/), the faithfulness anchors (Faithful/),
# and the whole-machine/trace layer (Soundness/). Same linter set as the other core pillars above.
[[lean_lib]]
name = "SP1Proofs"
globs = ["SP1Clean.Proofs.+", "SP1Clean.Faithful.+", "SP1Clean.Soundness.+"]
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]

# The test pillar (the `lake test` driver, see `testDriver` above) — the exportability battery,
# the non-vacuity/real-row satisfiability anchors, and the circuit-as-trace-generator substrate
# (`SP1CleanTest.{Exportable,NonVacuity,NonVacuityReal,Audit,TraceGenTests}.*`), which import the
# main `SP1Clean` library. This is the ONLY library that may use `native_decide`; it is NOT
# imported by the umbrella `SP1Clean`, so the default `lake build` stays `native_decide`-free.
# Same syntactic linter set as the core pillars. (The `lake lint` env-linter pass skips this lib
# too — `sp1Lint` keeps only `SP1Clean`-prefixed declarations, and `SP1CleanTest` is not such a
# prefix.) Trace conformance against SP1's real prover lives in the dump-anchored pipeline
# (`export/sp1dump/` + the `--testdata` generation-time gate + the Rust differential).
[[lean_lib]]
name = "SP1CleanTest"
globs = ["SP1CleanTest.+"]
moreLeanArgs = [
  "-Dlinter.style.lambdaSyntax=true", "-Dlinter.style.dollarSyntax=true",
  "-Dlinter.style.refine=true", "-Dlinter.style.cases=true",
  "-Dlinter.style.induction=true", "-Dlinter.style.admit=true",
  "-Dlinter.oldObtain=true", "-Dlinter.style.cdot=true",
]
