name = "sp1-clean-native"
defaultTargets = ["SP1Clean"]

moreLeanArgs = ["--tstack=400000"]

# Built-in options only (no Mathlib linter options here — those require a Mathlib
# linter module to be imported before the package -D flags are validated, which a
# Clean-only file does not pull in; see the sp1-lean Step 0 finding).
[leanOptions]
pp.unicode.fun = true
synthInstance.maxHeartbeats = 1000000

# Public, non-fork dependencies, aligned on Lean 4.28 / Mathlib v4.28.0.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.28.0"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "main"

[[require]]
name = "LeanRV64D"
git = "https://github.com/succinctlabs/sail-riscv-lean"
rev = "dtumad/clean-native"

[[require]]
name = "RISCV"
git = "https://github.com/succinctlabs/riscv-lean"
rev = "dtumad/clean-native"

[[lean_lib]]
name = "SP1Clean"
