name = "sp1-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SP1Operations", "SP1Chips"]

moreLeanArgs = ["--tstack=400000"]
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
linter.unusedSimpArgs = false
synthInstance.maxHeartbeats = 1000000
# autoImplicit = false -- Might be good to consider this, given the amount of coercions we use

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.23.0-rc2"

[[lean_lib]]
name = "SP1Foundations"

[[lean_lib]]
name = "SP1Operations"

[[lean_lib]]
name = "SP1Chips"

[[lean_lib]]
name = "LeanRV64D"
