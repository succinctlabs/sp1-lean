name = "sp1-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SP1Operations", "SP1Chips"]

moreLeanArgs = ["--tstack=400000"]
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
linter.unusedSimpArgs = false
# autoImplicit = false -- Might be good to consider this, given the amount of coercions we use

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.22.0-rc2"

# [[require]]
# name = "Lean_RV32D"
# git = "https://github.com/succinctlabs/sail-rv32d-lean"
# rev = "nightly"

[[lean_lib]]
name = "SP1Foundations"

[[lean_lib]]
name = "SP1Operations"

[[lean_lib]]
name = "SP1Chips"

[[lean_lib]]
name = "LeanRV32D"

[[lean_exe]]
name = "run-rv32d"
root = "LeanRV32D"

[[lean_lib]]
name = "LeanRV32IM"

[[lean_lib]]
name = "LeanRV64IM"
