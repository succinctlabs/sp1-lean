name = "sp1-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SP1Operations", "SP1Chips", "SP1Clean"]

moreLeanArgs = ["--tstack=400000"]
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
linter.unusedSimpArgs = false
linter.flexible = false
synthInstance.maxHeartbeats = 1000000
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

# Fork of `https://github.com/opencompl/sail-riscv-lean` with custom `Platform.lean`.
[[require]]
name = "LeanRV64D"
git = "https://github.com/succinctlabs/sail-riscv-lean"
rev = "v6.1.0"

# Pilot dep on Verified-zkEVM/clean (use case B from docs/CLEAN_DSL_EVALUATION.md).
# Tracks a sibling checkout at ../clean on the bump-lean-4.29 branch.
[[require]]
name = "Clean"
path = "../clean"

[[lean_lib]]
name = "SP1Foundations"

[[lean_lib]]
name = "SP1Operations"

[[lean_lib]]
name = "SP1Chips"

[[lean_lib]]
name = "SP1Clean"
