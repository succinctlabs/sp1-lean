name: Lean Action CI

on:
  # Run on push to `main`/`ci-testing`, any pull request, or manual dispatch
  push:
    branches: ["main", "ci-testing"]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    # Lightweight source-policy gates — run on a standard runner in parallel with the
    # heavy build so a forbidden pattern blocks the PR in seconds without a Lean build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No skipKernelTC in source
        run: scripts/check_no_skipkerneltc.sh
      - name: No native_decide in the main SP1Clean library
        run: scripts/check_no_native_decide.sh
      - name: Elaboration-budget escape hatches confined to the measured allowlist
        run: scripts/check_option_escapes.sh
      - name: Witness-generation escape hatches (enforced — the witgen cutover is complete)
        run: scripts/check_no_witness_native.sh --enforce
      - name: Committed witgen export is structurally clean
        run: scripts/check_witgen_export.sh
      - name: Recorded pins match the build graph
        run: scripts/check_pins.sh
      - name: Root index imports every module
        run: scripts/check_root_index.sh
      - name: Doc citations resolve
        run: scripts/check_report_citations.sh
      - name: Audit-surface index matches the tree
        run: scripts/check_audit_surface.sh

  build:
    runs-on:
      [
        runs-on,
        runner=64cpu-linux-x64,
        spot=false,
        disk=large,
        "run-id=${{ github.run_id }}",
      ]

    steps:
      - uses: actions/checkout@v4
      # Test that the project builds without failure
      # Note: defaults to ignore warnings and deprecations, maybe change eventually
      # lean-action's `use-github-cache` caches the WHOLE `.lake` (project build + deps) under a
      # commit-keyed key (`lake-<os>-<arch>-<toolchain>-<manifest>-<sha>`) with a manifest-prefix
      # `restore-keys` fallback. So this build is incremental from the most recent prior commit, and the
      # exact-`<sha>` cache it saves is what the `lint`/`test` jobs restore (an exact hit → `lake build`
      # there just replays, no recompilation). No separate per-commit project cache is needed.
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "true"
      # Hand the freshly-built project oleans to the `lint` job via a commit-keyed cache.
      # lean-action's own `use-github-cache` covers dependencies only (keyed on the manifest), not the
      # per-commit project build — so without this the lint job would rebuild the whole project.
      - name: Cache build outputs for the lint job
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ github.sha }}

  lint:
    # Environment linters (`lake lint` → the `sp1Lint` lintDriver; a curated subset of the Batteries
    # `#lint` linters over the hand-written `SP1Clean.*` declarations; see AGENTS.md § Linters). Split
    # into its own job so it is clearly independent in the checks list. `needs: build` so it runs after
    # the build job has saved its exact-`<sha>` `.lake` cache; lean-action below restores that on an exact
    # hit, so `lake build` just replays the already-built project (no recompilation) before `lake lint`.
    # If that cache were ever absent, lean-action's manifest-prefix `restore-keys` fallback does a correct
    # incremental build instead, so the job stays correct either way.
    needs: build
    runs-on:
      [
        runs-on,
        runner=64cpu-linux-x64,
        spot=false,
        disk=large,
        "run-id=${{ github.run_id }}",
      ]

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "true"
      - name: Environment linters (lake lint)
        run: lake lint

  test:
    # Conformance tests (`lake test` → the `SP1CleanTest` testDriver: the exportability battery and
    # the non-vacuity/real-row satisfiability anchors; whole-trace conformance itself is the separate
    # dump-anchored pipeline re-run below via `check_witgen_export.sh --regen`).
    # These live in their own library — the ONLY place `native_decide` is allowed — so they are gated
    # here, separately from the `native_decide`-free main build. Split into its own job (in parallel with
    # `lint`) so the trusted-compiler checks are clearly independent in the checks list. `needs: build`
    # so it runs after the build job has saved its exact-`<sha>` `.lake` cache; lean-action below restores
    # that on an exact hit, so `lake build` replays the already-built main library (no recompilation) and
    # `lake test` only elaborates the test modules. If that cache were ever absent, lean-action's
    # manifest-prefix `restore-keys` fallback does a correct incremental build instead.
    needs: build
    runs-on:
      [
        runs-on,
        runner=64cpu-linux-x64,
        spot=false,
        disk=large,
        "run-id=${{ github.run_id }}",
      ]

    steps:
      - uses: actions/checkout@v4
        # run_audit.sh verifies the census provenance stamp with
        # `git merge-base --is-ancestor`, which needs the stamped commit in this clone.
        # The default shallow fetch would make that check fail for the wrong reason.
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "true"
      - name: Conformance tests (lake test)
        run: lake test
      # The committed export/witgen goldens must match a fresh regeneration byte-for-byte.
      # This runs here (not in `guards`) because the exporter needs the SP1CleanTest oleans
      # that `lake test` just built — golden drift on a Clean pin bump is caught automatically.
      - name: Witgen export matches a fresh regeneration
        run: scripts/check_witgen_export.sh --regen
      # The test-scope axiom census (scripts/axiom_probe_test.lean) elaborates against the
      # SP1CleanTest oleans that `lake test` just built — the only job where they exist. The
      # main-scope census runs in the `audit` job, which builds only the default SP1Clean target.
      - name: Test-library axiom census (scripts/run_audit.sh --test-only)
        run: scripts/run_audit.sh --test-only

  audit:
    # The release audit harness (`scripts/run_audit.sh --main-only`): pin cross-checks, the
    # zero-tolerance proof-deferral and project-axiom scans, the source-policy guards, and the
    # authoritative `#print axioms` census over the released main-library theorem surface, gated
    # against the committed `docs/snapshots/axiom-census.txt` (a drift fails; `--update` is a
    # local, deliberate act). `--main-only` because this job builds only the default `SP1Clean`
    # target — the test-scope census runs in the `test` job, whose `lake test` produces the
    # `SP1CleanTest` oleans that probe needs. `needs: build` for the same commit-keyed `.lake`
    # cache reuse as `lint`/`test` — the census probe elaborates against the built oleans.
    needs: build
    runs-on:
      [
        runs-on,
        runner=64cpu-linux-x64,
        spot=false,
        disk=large,
        "run-id=${{ github.run_id }}",
      ]

    steps:
      - uses: actions/checkout@v4
        # run_audit.sh verifies the census provenance stamp with
        # `git merge-base --is-ancestor`, which needs the stamped commit in this clone.
        # The default shallow fetch would make that check fail for the wrong reason.
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "true"
      - name: Release audit, main scope (scripts/run_audit.sh --main-only)
        run: scripts/run_audit.sh --main-only
